name: Package plugin
description: Packages the plugin for specified architecture and build config.
inputs:
  target:
    description: Build target for dependencies
    required: true
  config:
    description: Build configuration
    required: false
    default: RelWithDebInfo
  codesign:
    description: Enable codesigning (macOS only)
    required: false
    default: 'false'
  notarize:
    description: Enable notarization (macOS only)
    required: false
    default: 'false'
  codesignIdent:
    description: Developer ID for application codesigning (macOS only)
    required: false
    default: '-'
  installerIdent:
    description: Developer ID for installer package codesigning (macOS only)
    required: false
    default: ''
  codesignTeam:
    description: Developer team for codesigning (macOS only)
    required: false
    default: ''
  codesignUser:
    description: Apple ID username for notarization (macOS only)
    required: false
    default: ''
  codesignPass:
    description: Apple ID password for notarization (macOS only)
    required: false
    default: ''
  package:
    description: Create Windows or macOS installation package
    required: false
    default: 'false'
  workingDirectory:
    description: Working directory for packaging
    required: false
    default: ${{ github.workspace }}
runs:
  using: composite
  steps:
    - name: Run macOS Packaging
      if: runner.os == 'macOS'
      shell: zsh --no-rcs --errexit --pipefail {0}
      working-directory: ${{ inputs.workingDirectory }}
      env:
        CODESIGN_IDENT: ${{ inputs.codesignIdent }}
        CODESIGN_IDENT_INSTALLER: ${{ inputs.installerIdent }}
        CODESIGN_TEAM: ${{ inputs.codesignTeam }}
        CODESIGN_IDENT_USER: ${{ inputs.codesignUser }}
        CODESIGN_IDENT_PASS: ${{ inputs.codesignPass }}
      run: |
        : Run macOS Packaging

        local -a package_args=(--config ${{ inputs.config }})
        if (( ${+RUNNER_DEBUG} )) package_args+=(--debug)

        if [[ '${{ inputs.codesign }}' == 'true' ]] package_args+=(--codesign)
        if [[ '${{ inputs.notarize }}' == 'true' ]] package_args+=(--notarize)
        if [[ '${{ inputs.package }}' == 'true' ]] package_args+=(--package)

        .github/scripts/package-macos ${package_args}

    - name: Install Dependencies 🛍️
      if: runner.os == 'Linux'
      shell: bash
      run: |
        : Install Dependencies 🛍️
        echo ::group::Install Dependencies
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> $GITHUB_PATH
        brew install --quiet zsh
        echo ::endgroup::

    - name: Run Ubuntu Packaging
      if: runner.os == 'Linux'
      shell: zsh --no-rcs --errexit --pipefail {0}
      working-directory: ${{ inputs.workingDirectory }}
      run: |
        : Run Ubuntu Packaging
        package_args=(
          --target ubuntu-${{ inputs.target }}
          --config ${{ inputs.config }}
        )
        if (( ${+RUNNER_DEBUG} )) build_args+=(--debug)

        if [[ '${{ inputs.package }}' == 'true' ]] package_args+=(--package)

        .github/scripts/package-ubuntu ${package_args}

    - name: Run Windows Packaging
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Run Windows Packaging
        if ( $Env:RUNNER_DEBUG -ne $null ) {
          Set-PSDebug -Trace 1
        }

        $PackageArgs = @{
          Target = '${{ inputs.target }}'
          Configuration = '${{ inputs.config }}'
        }

        .github/scripts/Package-Windows.ps1 @PackageArgs

    - name: Build Windows Installer 📥
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Build the Inno Setup installer alongside the zip.
        #
        # The zip leaves an operator to put the files in the one folder OBS reads
        # and no other, which is the mistake this plugin's own history records.
        # GitHub's Windows images ship Inno Setup, so this costs a build step and
        # no new dependency; CMake skips the target when ISCC is absent, which is
        # why a local build without Inno Setup still works.
        #
        # The DLL comes from the install tree the zip is made from, not from the
        # CMake 'installer' target: that target builds its own RelWithDebInfo
        # copy, so a tagged Release build would ship two different DLLs, and
        # only this one is the one that was signed. The staging layout is the
        # one the target uses, since the configured .iss points at it.
        $Iscc = (Get-Command ISCC -ErrorAction SilentlyContinue).Source
        if ( $null -eq $Iscc ) {
          $Iscc = "${Env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        }
        if ( ! ( Test-Path $Iscc ) ) {
          Write-Warning 'Inno Setup (ISCC) not found on this runner; skipping the installer.'
          exit 0
        }

        $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
        $Name = $BuildSpec.name
        $Dll = "release/${{ inputs.config }}/${Name}/bin/64bit/${Name}.dll"
        $Stage = "build_x64/installer-stage/${Name}"

        Remove-Item -Recurse -Force $Stage -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force "${Stage}/bin/64bit" | Out-Null
        Copy-Item -Recurse data "${Stage}/data"
        Copy-Item $Dll "${Stage}/bin/64bit/${Name}.dll"

        & $Iscc build_x64/installer-Windows.iss
        if ( $LASTEXITCODE ) { throw "ISCC failed with exit code ${LASTEXITCODE}" }
